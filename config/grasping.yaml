# How the gripper takes each kind of object (the YOLO class names of config/perception.yaml). Read by
# planning/pick_planner.py (grasp_settings); the squeeze by state_machine/arm_worker.py.
#
# postures          the grasps to try, in order: horizontal (level, from the side) and/or down (top-down);
#                   auto = level first, top-down first within --close-radius of the arm's base (the game's default)
# min_finger_cover  top-down grasps: at least this much of the object's height between the fingers [m]; a higher
#                   grasp point is not used (only the top of the object would be held)
# squeeze           how far the gripper keeps closing past where it stopped on the object (0-100 units)
# faces             an object with parallel faces every this many degrees (a cube: 90): with its angle from the
#                   camera, a top-down grasp closes the jaws square to a pair of faces; across a corner only when the
#                   object has room to turn into the jaws. null: any angle (round or no parallel faces)
# level_over_top    an object too short for a level grasp below its top may still be grasped level with the grasp
#                   point over it, as the last resort (a level grasp reaches ~42 cm, top-down ~35 cm)
# drop_posture      the gripper over the bin at release: level (from its side: an object picked top-down is turned
#                   level on the way, the release point aimed so it lands in the bin), pick (as it was picked) or
#                   down; the other one when that has no plan
#
# A shape not listed uses `defaults`. --pick-posture level on the command line still means level only.

defaults:
  postures: auto
  min_finger_cover: 0.012
  squeeze: 2.0
  faces: null
  level_over_top: true
  drop_posture: level

objects:
  cylinder:
    # Round: flat jaws touch it along two lines; held only near its top it rolls out sideways or tips. Level grips
    # it round the middle; top-down only with most of it between the fingers, and a firmer squeeze.
    postures: [horizontal, down]
    min_finger_cover: 0.03
    squeeze: 4.0
  cube:
    # Gripped across a corner, parallel jaws touch two edges and the cube twists in the jaws (into its neighbours, in
    # a cluster): square to its faces.
    faces: 90
